[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adxray-spy"
version = "1.1.0b1"
description = "ADXRay 广告投放数据提取工具 - 输入游戏名，自动提取投放数据"
authors = [{name = "adxray-spy"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl==3.1.5",
    "playwright==1.60.0",
]

[project.scripts]
adxray-spy-cli = "adxray_spy_core:main_cli"

[project.gui-scripts]
adxray-spy = "adxray_spy_gui:main"

[project.optional-dependencies]
build = [
    "pyinstaller==6.21.0",
]

[tool.setuptools]
py-modules = ["adxray_spy_core", "adxray_spy_gui"]
